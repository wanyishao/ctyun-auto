services:
  ctyun-auto:
    image: ghcr.io/wanyishao/ctyun-auto:latest
    container_name: ctyun-auto
    network_mode: "bridge"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "deskcdn.ctyun.cn:106.120.187.154"
      - "deskcdn.ctyun.cn.ctadns.cn:106.120.187.154"
    environment:
      APP_USER: "请替换为天翼云手机号"
      APP_PASSWORD: "请替换为天翼云密码"
      RUNNING_IN_DOCKER: "true"
      CRON_LOGIN: "0 3,20 * * *"
      CRON_PC: "0 4,6 * * *"
      PC_MAX_RUNTIME_SECONDS: "7200"
      INIT_RUN: "false"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
