services:
  ctyun-auto:
    image: ctyun-auto:local-final-20261103
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ctyun-auto
    network_mode: "bridge"
    restart: on-failure
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./data/redeem_config.json:/app/redeem_config.json
    extra_hosts:
      - "deskcdn.ctyun.cn:106.120.187.154"
      - "deskcdn.ctyun.cn.ctadns.cn:106.120.187.154"
    environment:
      RUNNING_IN_DOCKER: "true"
      CRON_LOGIN: "${CRON_LOGIN:-0 3,20 * * *}"
      # AI 对话任务：默认每天 03:00 和 20:00 执行。
      CRON_PC: "${CRON_PC:-0 4,6 * * *}"
      # 单次网页挂机最长运行时间（秒）；默认 7200。
      PC_MAX_RUNTIME_SECONDS: "${PC_MAX_RUNTIME_SECONDS:-7200}"
      # 默认关闭；在 .env 中设置 INIT_RUN=true 可启动时各执行一次。
      INIT_RUN: "${INIT_RUN:-false}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
